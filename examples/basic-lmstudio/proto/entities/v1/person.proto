syntax = "proto3";
package entities.v1;
option go_package = "github.com/laenen-partners/llmextract/examples/basic-lmstudio/gen/entities/v1;entitiesv1";

import "google/protobuf/timestamp.proto";

message Person {
  string full_name = 1;
  string email = 2;
  string phone = 3;
  int32 age = 4;
  google.protobuf.Timestamp date_of_birth = 5;
  string role = 6;
  string language = 7;
}
