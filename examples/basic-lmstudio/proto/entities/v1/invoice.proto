syntax = "proto3";
package entities.v1;
option go_package = "github.com/laenen-partners/llmextract/examples/basic-lmstudio/gen/entities/v1;entitiesv1";

import "google/protobuf/timestamp.proto";

message LineItem {
  string description = 1;
  double quantity = 2;
  double unit_price = 3;
  double amount = 4;
  double tax_rate = 5;
}

message Invoice {
  string invoice_number = 1;
  google.protobuf.Timestamp date = 2;
  google.protobuf.Timestamp due_date = 3;
  string currency = 4;
  double total_amount = 5;
  double tax_amount = 6;
  repeated LineItem line_items = 7;
  string seller_name = 8;
  string buyer_name = 9;
  double subtotal = 10;
  string seller_tax_id = 11;
  string buyer_tax_id = 12;
  string payment_terms = 13;
  string notes = 14;
  string language = 15;
}
